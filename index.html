<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brent Bot">
<title>Brent Bot</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #07080c; color: #f4f4f5; }
  .wrap { max-width: 430px; margin: 0 auto; padding: 28px 18px 40px; }
  .card { background: #14161c; border: 1px solid #27272a; border-radius: 22px; padding: 18px; margin-bottom: 12px; }
  .sig { font-size: 42px; font-weight: 760; }
  .buy { color: #4ade80; } .sell { color: #fb7185; } .flat { color: #fbbf24; }
  .price { font-size: 34px; margin-top: 8px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #27272a; }
  button { width: 100%; border: 0; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 650; }
  .note { color: #a1a1aa; font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Brent Bot</h1>
    <div class="card">
      <div id="sig" class="sig flat">...</div>
      <div id="price" class="price">—</div>
      <div class="row"><span>RSI</span><b id="rsi">—</b></div>
      <div class="row"><span>Trend 15m</span><b id="trend">—</b></div>
      <div class="row"><span>Motivo</span><b id="why">carico</b></div>
    </div>
    <button id="go">Aggiorna segnale</button>
    <p class="note">Safari, Condividi, Aggiungi a Home. Non apre ordini.</p>
  </div>
<script>
const OFFSET = 3.35;
function ema(v, n) { const k = 2 / (n + 1); let e = v[0]; const o = [e]; for (let i = 1; i < v.length; i++) { e = v[i] * k + e * (1 - k); o.push(e); } return o; }
function rsi(v, n = 14) { let g = 0, l = 0; for (let i = v.length - n; i < v.length; i++) { const d = v[i] - v[i - 1]; if (d >= 0) g += d; else l -= d; } if (!l) return 100; const rs = (g / n) / (l / n); return 100 - 100 / (1 + rs); }
function paint(side, price, rsiV, trend, why) { const el = document.getElementById('sig'); el.textContent = side; el.className = 'sig ' + (side === 'COMPRA' ? 'buy' : side === 'VENDI' ? 'sell' : 'flat'); document.getElementById('price').textContent = price ? price.toFixed(2) + ' $' : '—'; document.getElementById('rsi').textContent = rsiV ? rsiV.toFixed(1) : '—'; document.getElementById('trend').textContent = trend; document.getElementById('why').textContent = why; }
async function load() { document.getElementById('why').textContent = 'aggiorno...'; const url = 'https://query1.finance.yahoo.com/v8/finance/chart/BZ=F?interval=15m&range=5d'; const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)); const data = await res.json(); const q = data.chart.result[0]; const closes = q.indicators.quote[0].close.filter(x => x != null); const price = closes.at(-1) + OFFSET; const e20 = ema(closes, 20).at(-1) + OFFSET; const e50 = ema(closes, 50).at(-1) + OFFSET; const r = rsi(closes); let trend = 'SIDEWAYS', side = 'NEUTRO', why = 'nessun trend pulito'; if (price > e20 && e20 > e50) trend = 'BULLISH'; if (price < e20 && e20 < e50) trend = 'BEARISH'; if (trend === 'BULLISH' && r >= 42 && r <= 62) { side = 'COMPRA'; why = '15m e media allineati'; } else if (trend === 'BEARISH' && r >= 38 && r <= 58) { side = 'VENDI'; why = '15m e media allineati'; } else if (trend === 'BULLISH') why = 'rialzista ma RSI fuori fascia'; else if (trend === 'BEARISH') why = 'ribassista ma RSI fuori fascia'; paint(side, price, r, trend, why); }
document.getElementById('go').onclick = () => load().catch(() => paint('NEUTRO', 0, 0, '—', 'rete bloccata, riprova'));
load().catch(() => paint('NEUTRO', 0, 0, '—', 'apri da Safari e aggiorna'));
</script>
</body>
</html>
